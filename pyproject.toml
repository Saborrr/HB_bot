[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hb-bot"
version = "2.0.0"
description = "Privacy-conscious Telegram birthday reminder bot"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Александр Санычев", email = "aa_fdv@users.noreply.github.com" }]
dependencies = [
  "aiogram>=3.31,<4",
  "SQLAlchemy>=2.0.52,<3",
  "pydantic-settings>=2.15,<3",
  "python-dotenv>=1.2.3,<2",
  "aiosqlite>=0.22,<1",
  "asyncpg>=0.31,<1",
  "alembic>=1.19,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "pip-audit>=2.9,<3",
  "ruff>=0.16.6,<0.17",
  "setuptools>=83",
]

[project.scripts]
hb-bot = "hb_bot.__main__:run"
hb-import = "hb_bot.importer:run"
hb-migrate = "hb_bot.migrations:run_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/hb_bot"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
